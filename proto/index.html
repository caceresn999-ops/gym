<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060607">
<title>Forja · prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060607;--s1:#111113;--s2:#1A1A1D;--s3:#242428;--line:#232327;
  --ink:#F6F5F2;--ink2:#A3A1A8;--ink3:#6C6A71;
  --ember:#FF4D1F;--orange:#FF8A1F;--gold:#FFB21A;--lime:#C6F432;--red:#FF4D5E;
  --grad:linear-gradient(135deg,#FF4D1F 0%,#FF8A1F 55%,#FFB21A 100%);
  --done:rgba(255,106,31,.13);
  --spring:cubic-bezier(.2,1.4,.35,1);--out:cubic-bezier(.16,1,.3,1);
  --display:"Bricolage Grotesque",-apple-system,sans-serif;
  color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{max-width:480px;margin:auto;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -30% auto;height:460px;pointer-events:none;z-index:0;
  background:radial-gradient(60% 60% at 70% 20%,rgba(255,77,31,.22),transparent 70%),radial-gradient(50% 50% at 15% 0%,rgba(255,178,26,.12),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:active{transform:scale(.97)}
.screen{display:none;position:relative;z-index:1;padding:10px 18px calc(110px + env(safe-area-inset-bottom))}
.screen.on{display:block}
.enter > *{animation:rise .55s var(--out) backwards}
.enter > *:nth-child(2){animation-delay:.06s}.enter > *:nth-child(3){animation-delay:.12s}.enter > *:nth-child(4){animation-delay:.18s}.enter > *:nth-child(5){animation-delay:.24s}.enter > *:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.top{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px var(--display);letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.streak{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 9px;font-weight:600;font-size:14px}
.streak svg{width:18px;height:18px}
h1{font:800 38px/1 var(--display);letter-spacing:-.03em;margin:0}
.hello{color:var(--ink2);font-size:15px;margin:0 0 4px}
h2{font:700 20px var(--display);letter-spacing:-.01em;margin:30px 0 12px}
.muted{color:var(--ink2)}.small{font-size:13px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px}
/* hoy */
.today{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:#140b07;border:1px solid rgba(255,138,31,.25);margin-top:16px}
.today::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,77,31,.55),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(255,178,26,.22),transparent 60%);animation:breathe 6s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.08) translate(-2%,2%)}}
.today > *{position:relative}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:#FFD9C2;background:rgba(255,255,255,.08);border-radius:999px;padding:5px 10px}
.today h3{font:800 46px/1 var(--display);letter-spacing:-.035em;margin:14px 0 6px}
.today .meta{color:#E8C9B7;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 20px}
.chips span{font-size:13px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 10px;color:#F3E6DD}
.go{position:relative;overflow:hidden;width:100%;height:58px;border-radius:16px;background:#fff;color:#0B0B0C;font:700 18px var(--display);display:flex;align-items:center;justify-content:center;gap:10px}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,140,60,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s 1.2s ease-in-out infinite}
@keyframes shine{40%,100%{transform:translateX(100%)}}
.go svg{width:20px;height:20px}
.weekwrap{display:flex;align-items:center;gap:18px}
.ring{width:92px;height:92px;flex:0 0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 26px var(--display);line-height:1}
.ring b small{display:block;font:500 11px system-ui;color:var(--ink2);margin-top:2px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--ink3)}
.days i{display:block;width:26px;height:26px;margin:6px auto 0;border-radius:9px;background:var(--s2);font-style:normal;line-height:26px;color:var(--ink2);font-size:12px}
.days i.now{background:transparent;outline:2px solid var(--ember);color:var(--ink)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 .card{padding:14px}
.stat3 b{display:block;font:800 24px var(--display);letter-spacing:-.02em}
.stat3 small{color:var(--ink2);font-size:12px}
.up{color:var(--lime)}.down{color:var(--red)}
.feed .row{display:flex;justify-content:space-between;align-items:baseline}
.feed b.t{font:700 19px var(--display)}
.feed ul{list-style:none;margin:12px 0 0;padding:0;font-size:15px;color:var(--ink2)}
.feed li{padding:4px 0;display:flex;gap:8px}
.feed li em{font-style:normal;color:var(--ink3);width:22px}
/* tab bar */
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:448px;margin:auto;z-index:5;
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(28,28,31,.72);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:6px}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:rgba(255,255,255,.09);transition:transform .38s var(--spring)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:7px 0;transition:color .2s}
nav button.on{color:var(--ink)}
nav button.on svg{stroke:var(--orange)}
nav svg{width:24px;height:24px}
/* workout */
#workout{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none;max-width:480px;margin:auto}
#workout.on{display:block;animation:sheetup .45s var(--out)}
@keyframes sheetup{from{transform:translateY(60px);opacity:0}}
.wbar{position:sticky;top:0;z-index:2;padding:12px 16px 10px;background:rgba(6,6,7,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.wrow{display:flex;align-items:center;justify-content:space-between}
.wt{text-align:center}
.wt b{display:block;font:700 17px var(--display)}
.wt small{color:var(--ink2);font-size:13px}
.fin{background:var(--grad);color:#120804;font-weight:700;border-radius:11px;padding:9px 14px}
.prog{height:4px;border-radius:3px;background:var(--s2);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);transform-origin:left;transform:scaleX(0);transition:transform .5s var(--out)}
.ex{padding:20px 16px 6px;animation:rise .5s var(--out) backwards}
.ex h4{margin:0;font:700 21px var(--display);letter-spacing:-.01em}
.hint{display:inline-flex;gap:6px;align-items:center;margin:8px 0 12px;font-size:13px;color:var(--ink2);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.hint b{color:var(--gold);font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-size:11px;color:var(--ink3);font-weight:600;text-align:center;letter-spacing:.08em;padding:0}
td{text-align:center;padding:0 2px;height:50px;background:var(--s1);transition:background .35s}
td:first-child{border-radius:14px 0 0 14px;color:var(--ink2);font-weight:600;width:34px}
td:last-child{border-radius:0 14px 14px 0}
tr.done td{background:var(--done)}
td.prev{color:var(--ink3);font-size:14px}
td input{width:62px;height:38px;border-radius:10px;border:0;background:var(--s2);color:var(--ink);text-align:center;font:700 18px var(--display);transition:background .3s}
td input::placeholder{color:#57565C}
tr.done input{background:transparent}
.chk{width:42px;height:38px;border-radius:11px;background:var(--s2);display:grid;place-items:center;margin:auto;position:relative}
.chk svg{width:20px;height:20px;stroke:var(--ink3)}
.chk svg path{stroke-dasharray:24;stroke-dashoffset:0}
tr.done .chk{background:var(--grad);animation:pop .42s var(--spring)}
tr.done .chk svg{stroke:#120804}
tr.done .chk svg path{animation:draw .3s .05s var(--out) backwards}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}}
.prbadge{position:absolute;right:-6px;top:-10px;background:var(--gold);color:#120804;font:800 10px var(--display);border-radius:6px;padding:2px 5px;animation:pop .5s var(--spring)}
.add{width:100%;height:42px;border-radius:12px;border:1px dashed #333338;color:var(--ink2);font-size:15px;margin-top:4px}
#rest{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:452px;margin:auto;z-index:12;display:none;align-items:center;gap:12px;
  background:rgba(28,28,31,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:10px 12px}
#rest.on{display:flex;animation:sheetup .4s var(--out)}
.rring{width:52px;height:52px;position:relative;flex:0 0 auto}
.rring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rring circle.p{transition:stroke-dashoffset 1s linear}
.rclock{flex:1}
.rclock b{display:block;font:800 24px var(--display)}
.rclock small{color:var(--ink2);font-size:12px}
#rest button{background:var(--s3);border-radius:11px;padding:10px 11px;font-size:14px;font-weight:600}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:none;align-items:flex-end}
.sheet.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;width:100%;max-width:480px;margin:auto;background:var(--s1);border-radius:28px 28px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));animation:sheetup .5s var(--out);overflow:hidden}
.panel .glow{position:absolute;inset:-40% -20% auto;height:280px;background:radial-gradient(50% 50% at 50% 50%,rgba(255,120,31,.35),transparent 70%);pointer-events:none}
.big{position:relative;font:800 34px/1.05 var(--display);letter-spacing:-.03em;margin:0 0 16px}
.sumg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.sumg div{background:var(--s2);border-radius:16px;padding:14px}
.sumg b{display:block;font:800 26px var(--display)}
.sumg small{color:var(--ink2);font-size:12px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.gold{background:rgba(255,178,26,.15);color:var(--gold)}
.pill.up{background:rgba(198,244,50,.12);color:var(--lime)}
.pill.down{background:rgba(255,77,94,.13);color:var(--red)}
.pill.flat{background:var(--s2);color:var(--ink2)}
.btn{display:block;width:100%;height:54px;border-radius:16px;background:var(--grad);color:#120804;font:700 17px var(--display);margin-top:20px;position:relative}
.ghost{display:block;width:100%;height:48px;border-radius:14px;background:var(--s1);color:var(--ink2);font-size:15px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
/* lists */
.list{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;animation:rise .45s var(--out) backwards}
.li:last-child{border:0}
.li .grow{flex:1;min-width:0}
.li .name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta{font-size:13px;color:var(--ink2);margin-top:3px}
.li .ic{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font:800 13px var(--display);color:var(--orange);flex:0 0 auto}
.spark{width:64px;height:28px;flex:0 0 auto}
.chev{color:var(--ink3);font-size:20px}
.month{position:sticky;top:0;z-index:1;background:linear-gradient(var(--bg) 70%,transparent);font-size:12px;font-weight:700;color:var(--ink3);margin:18px 0 0;padding:8px 4px;letter-spacing:.1em;text-transform:uppercase}
/* progreso */
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;margin-top:14px}
.bars div{flex:1;border-radius:7px 7px 3px 3px;background:var(--grad);transform-origin:bottom;animation:grow .7s var(--out) backwards;position:relative}
.bars div.zero{background:var(--s2);min-height:4px}
.bars small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink3)}
@keyframes grow{from{transform:scaleY(0)}}
.goal{position:relative}
.goal::after{content:"meta 5";position:absolute;right:0;top:12px;font-size:11px;color:var(--ink3)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:3px;margin:16px 0}
.seg .sind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:11px;background:var(--s3);transition:transform .35s var(--spring)}
.seg button{position:relative;padding:9px 0;font-size:14px;color:var(--ink2);font-weight:600}
.seg button.on{color:var(--ink)}
.chart{position:relative;padding:16px 8px 8px}
.chart svg{width:100%;height:200px;display:block;touch-action:none}
.tip{position:absolute;top:8px;left:16px;font:800 30px var(--display);letter-spacing:-.02em}
.tip small{display:block;font:500 13px system-ui;color:var(--ink2);margin-top:2px}
.back{color:var(--orange);font-size:17px;font-weight:600;margin:4px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpis div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpis b{display:block;font:800 22px var(--display)}
.kpis small{color:var(--ink2);font-size:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head>
<body>
<canvas id="fx"></canvas>

<!-- HOY -->
<section class="screen on" id="s-inicio">
  <div class="top"><div class="brand"><span class="logo"><svg viewBox="0 0 56 56" fill="#120804"><rect x="8" y="30" width="10" height="18" rx="3"/><rect x="23" y="20" width="10" height="28" rx="3"/><rect x="38" y="8" width="10" height="40" rx="3"/></svg></span>Forja</div>
    <div class="streak"><svg viewBox="0 0 24 24" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-6 1-8.5z"/></svg><span id="streak">—</span></div></div>
  <div class="enter" id="home"></div>
</section>

<section class="screen" id="s-historial"><div class="top"><h1>Historial</h1></div><div id="hist"></div></section>

<section class="screen" id="s-progreso">
  <div id="prog-main"><div class="top"><h1>Progreso</h1></div><div class="enter" id="prog"></div></div>
  <div id="prog-detail" hidden></div>
</section>

<section class="screen" id="s-perfil"><div class="top"><h1>Perfil</h1></div>
  <div class="list">
    <div class="li"><span class="ic">MM</span><div class="grow"><div class="name">Programa</div><div class="meta">Min-Max · semana 8 de 12</div></div><span class="chev">›</span></div>
    <div class="li"><span class="ic">kg</span><div class="grow"><div class="name">Peso corporal</div><div class="meta">97,0 kg · +1 kg/mes</div></div><span class="chev">›</span></div>
    <div class="li"><span class="ic">cm</span><div class="grow"><div class="name">Medidas</div><div class="meta">Cintura, brazo, pecho, muslo</div></div><span class="chev">›</span></div>
    <div class="li"><span class="ic">⚙</span><div class="grow"><div class="name">Ajustes</div><div class="meta">Sincronización, descanso, extras</div></div><span class="chev">›</span></div>
  </div>
  <p class="muted small" style="margin:16px 4px">Prototipo · <a href="marca.html" style="color:var(--orange)">ver la marca</a></p>
</section>

<nav id="tabs"><span class="ind" id="ind"></span>
  <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Hoy</button>
  <button data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19V11M10 19V6M16 19v-5M21 4l-6 6-4-3-7 6"/></svg>Progreso</button>
  <button data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
</nav>

<div id="workout">
  <div class="wbar"><div class="wrow"><button id="wclose" class="muted" aria-label="Minimizar" style="font-size:22px;width:44px">⌄</button>
    <div class="wt"><b>Upper 1</b><small id="wtime">0:00 · 0 de 16 series</small></div><button class="fin" id="wfin">Terminar</button></div>
    <div class="prog"><i id="wprog"></i></div></div>
  <div id="wbody"></div>
  <div style="padding:18px 16px"><button class="ghost" id="wcancel">Descartar entreno</button></div>
  <div style="height:120px"></div>
</div>
<div id="rest"><div class="rring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="#2A2A2E" stroke-width="5"/><circle class="p" id="rarc" cx="26" cy="26" r="22" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/><defs><linearGradient id="g"><stop offset="0" stop-color="#FF4D1F"/><stop offset="1" stop-color="#FFB21A"/></linearGradient></defs></svg></div>
  <div class="rclock"><b id="rclock">2:00</b><small>Descanso</small></div><button id="rminus">−15</button><button id="rplus">+15</button><button id="rskip">Saltar</button></div>

<div class="sheet" id="done"><div class="panel"><div class="glow"></div><p class="big" id="dtitle">¡Entreno forjado!</p><div id="dbody"></div><button class="btn" id="dok">Listo</button></div></div>

<script src="data.js"></script>
<script>
const G = window.GYM, $ = s => document.querySelector(s);
const fmt = n => (Math.round(n * 10) / 10).toLocaleString('es-VE');
const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dows = ['dom','lun','mar','mié','jue','vie','sáb'];
const dlabel = d => { const x = new Date(d + 'T12:00'); return dows[x.getDay()] + ' ' + x.getDate() + ' ' + months[x.getMonth()]; };
const unit = u => u === 'pila' ? '' : ' kg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TODAY = '2026-11-24';
const PLAN = [['Incline Barbell Press',2,6,8,2.5],['Pec Deck',2,6,8,5],['Incline DB Y-Raise',2,8,10,2.5],['Pull-Up (Wide Grip)',2,6,8,0],
  ['Kelso Shrug',2,6,8,2.5],['Triceps Pressdown',2,6,8,5],['Machine Preacher Curl',2,6,8,2.5],['Dragon Flag',2,6,8,0]];
const TOTAL = PLAN.reduce((a, p) => a + p[1], 0);
const lastSets = n => G.series[n] ? G.series[n].points.at(-1)[4] : null;
function target(name, n, lo, hi, inc) {
  const last = lastSets(name);
  if (!last) return {sets: Array.from({length: n}, () => [null, null]), hint: 'Primera vez · elige peso para <b>' + lo + '–' + hi + '</b>'};
  const w = Math.max(...last.map(s => s[0]));
