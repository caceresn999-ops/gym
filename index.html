<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060607">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forja">
  <link rel="apple-touch-icon" href="./icons/forja-180.png">
  <link rel="icon" href="./icons/forja-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <title>Forja</title>
</head>
<body>
  <div id="sprite" hidden aria-hidden="true"></div>
  <main id="screen" tabindex="-1"><p role="status">Abriendo Forja…</p></main>
  <div id="session-capsule"></div>
  <div id="rest-dock"></div>
  <nav id="tabs" class="tabs" aria-label="Navegación principal" hidden></nav>
  <div id="keyboard-dock" hidden></div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <noscript><p>Activa JavaScript para registrar tus entrenamientos.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
